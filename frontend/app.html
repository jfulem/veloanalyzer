<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VeloAnalyzer — Race Reports</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="container">
    <div class="layout">
      <aside class="sidebar">
        <a class="brand" href="./index.html">
          <span class="brand-emoji">🚵</span>
          <span class="brand-name">VeloAnalyzer</span>
        </a>

        <nav class="side-nav">
          <a href="./app.html" class="active"><span class="icon">🏁</span> Start List</a>
          <a href="./results.html"><span class="icon">🏆</span> Results</a>
          <a href="./races.html"><span class="icon">🗓</span> Races</a>
          <a href="./riders.html"><span class="icon">👤</span> Riders</a>
          <a href="./about.html"><span class="icon">ℹ️</span> About</a>
        </nav>

        <div class="side-meta">
          Updated <span id="generated-at">—</span><br />
          Ranking data © <a href="https://www.uci.org" target="_blank" rel="noopener">uci.org</a><br />
          <a href="https://github.com/jfulem/veloanalyzer" target="_blank" rel="noopener">Source on GitHub</a>
        </div>
      </aside>

      <div class="main">
        <h1 class="page-title">Start List</h1>

        <p id="loading">Loading database…</p>

        <div id="app">
          <div class="race-selector">
            <select id="race-select" aria-label="Select race"></select>
          </div>

          <div class="race-meta">
            <strong id="race-name"></strong>
            <span id="race-date"></span> &nbsp;·&nbsp;
            <span id="race-cat"></span>
          </div>

          <div id="stats-area"></div>

          <div class="legend">
            <span><span class="legend-dot" style="background:#68d391"></span>TOP 50</span>
            <span><span class="legend-dot" style="background:#9ae6b4"></span>TOP 51–200</span>
            <span><span class="legend-dot" style="background:#f6e05e"></span>Ranked 201+</span>
            <span><span class="legend-dot" style="background:#4a5568"></span>Unranked</span>
            <span style="color:#718096; font-size:.8rem">Click two riders to compare</span>
          </div>

          <input
            id="search-input"
            class="search-box"
            type="search"
            placeholder="Search by name, country or team…"
            aria-label="Search riders"
          />

          <div id="table-area"></div>

          <p class="section-title">Starters by country</p>
          <div id="country-area"></div>

          <p class="section-title">Starters by team</p>
          <div id="team-area"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Rider detail modal -->
  <div id="rider-backdrop" class="modal-backdrop" hidden>
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="rider-modal-title">
      <div class="modal-header">
        <h2 id="rider-modal-title">Rider Profile</h2>
        <button id="rider-close" class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="rider-card"></div>
    </div>
  </div>

  <!-- H2H modal -->
  <div id="h2h-backdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">⚔ Head-to-Head</h2>
        <button id="h2h-close" class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="h2h-panel"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
