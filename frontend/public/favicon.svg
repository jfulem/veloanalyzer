<!-- The xmlns must be exactly this URI. Browsers parse SVG by namespace, so
     anything else (e.g. "http://w3.org") downloads fine with the right
     content-type but silently fails to render — the favicon just never
     appears. width/height are omitted so the viewBox governs scaling. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="240" fill="#090d16" stroke="#4169E1" stroke-width="6"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#1e293b" stroke-width="4"/>
  
  <g fill="#ffffff">

    <path d="M 110,160 L 165,160 L 225,360 L 170,360 Z" />
    <path d="M 280,190 L 225,360 L 170,360 L 225,190 Z" />
    
    <path d="M 285,140 L 345,140 L 415,360 L 355,360 Z" />
    <path d="M 285,140 L 225,320 L 280,320 L 340,140 Z" />
  </g>

</svg>
