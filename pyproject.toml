[project]
name = "mtb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "apscheduler>=3.11.0",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.121.0",
    "psycopg[binary]>=3.2.10",
    "python-levenshtein>=0.27.3",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
    "rich>=14.3.3",
    "sqlalchemy>=2.0.44",
    "thefuzz>=0.22.1",
    "uvicorn[standard]>=0.38.0",
]

# This project is an application, not a library: `uv sync` should install the
# dependencies without demanding a build backend to install the project itself.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
