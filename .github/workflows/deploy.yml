name: Deploy

# Frontend to Cloudflare Pages, read API to a Cloudflare Worker. The daily
# scrape lives in ingest.yml, not here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Typecheck the Worker
        working-directory: worker
        run: |
          npm ci
          npm run typecheck

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      # The ingest is the only Python left in production; make sure it imports
      # without a live database before a schedule fires and finds out.
      - name: Import smoke test
        env:
          DATABASE_URL: postgresql://user:pass@localhost/db
        run: |
          uv run python -c "
          from mtb_analyzer.ingest import run
          from mtb_analyzer.pipeline import fetch_riders
          from mtb_analyzer.store import save_all
          print('ingest imports OK')
          "

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs/
          if-no-files-found: error

  deploy-api:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deployed before the frontend: the bundle calls endpoints that must
      # already exist, so the reverse order would leave a window where the
      # live site requests routes the deployed API does not serve.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

  deploy-frontend:
    needs: [check, deploy-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: docs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=veloanalyzer --branch=main

  smoke:
    needs: [deploy-api, deploy-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify the deployment serves data
        run: |
          set -euo pipefail
          n=$(curl -fsS https://www.veloanalyzer.com/api/races | jq 'length')
          echo "races returned: $n"
          test "$n" -gt 0
          curl -fsS -o /dev/null https://www.veloanalyzer.com/
          echo "frontend OK"
