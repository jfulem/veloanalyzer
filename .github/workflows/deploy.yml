name: Deploy

# One deployable: the Worker serves the built site as static assets and the
# read API on /api/*. The daily scrape lives in ingest.yml, not here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Typecheck the Worker
        working-directory: worker
        run: |
          npm ci
          npm run typecheck

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      # The ingest is the only Python left in production; make sure it imports
      # without a live database before a schedule fires and finds out.
      - name: Import smoke test
        env:
          DATABASE_URL: postgresql://user:pass@localhost/db
        run: |
          uv run python -c "
          from mtb_analyzer.ingest import run
          from mtb_analyzer.pipeline import fetch_riders
          from mtb_analyzer.store import save_all
          print('ingest imports OK')
          "

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Validates wrangler.toml and that the assets directory exists and is
      # readable, without touching production.
      - name: Validate Worker deploy
        working-directory: worker
        run: npx wrangler deploy --dry-run

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs/
          if-no-files-found: error

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wrangler uploads docs/ as the Worker's static assets, so the built site
      # has to be back on disk before deploying.
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: docs

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # wrangler-action probes for an existing install with
      # `npx --no-install wrangler --version`. Without node_modules that probe
      # fails and the action installs its own pinned wrangler (3.90.0), which
      # wants @cloudflare/workers-types@4 and collides with the v5 this project
      # uses. Installing from the lockfile first means the action finds the
      # exact version we develop and dry-run against.
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Deploy Worker and site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

  smoke:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify the deployment serves both site and data
        run: |
          set -euo pipefail
          n=$(curl -fsS https://www.veloanalyzer.com/api/races | jq 'length')
          echo "races returned: $n"
          test "$n" -gt 0
          curl -fsS -o /dev/null https://www.veloanalyzer.com/
          curl -fsSL -o /dev/null https://www.veloanalyzer.com/app.html
          echo "site OK"
