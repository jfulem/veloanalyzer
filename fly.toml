app            = "veloanalyzer"
primary_region = "ams"

[build]

[deploy]
  # Runs in a temporary machine before the new version takes traffic, so a
  # failed migration aborts the deploy instead of leaving code and schema
  # out of step.
  release_command = "alembic upgrade head"

[env]
  MTB_CACHE_DIR = "/data/.mtb_cache"
  INGEST_HOUR   = "12"
  CORS_ORIGINS  = "https://www.veloanalyzer.com,https://veloanalyzer.com"

[http_service]
  internal_port        = 8080
  force_https          = true
  # Always-on: the machine holds the warm .mtb_cache volume and the in-process
  # UCI history memo, both of which make on-demand analysis fast, and the
  # APScheduler ingest only fires if the process is actually running.
  #
  # Must be the string "off", not the legacy boolean false — the boolean form
  # is not reliably honoured, and the machine gets autostopped after five idle
  # minutes (exit_code=0, requested_stop=true), which silently kills the
  # scheduler.
  auto_stop_machines   = "off"
  auto_start_machines  = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period  = "20s"
    interval      = "30s"
    method        = "GET"
    path          = "/health"
    timeout       = "5s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source      = "mtb_cache"
  destination = "/data"
