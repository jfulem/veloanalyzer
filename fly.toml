app            = "veloanalyzer"
primary_region = "ams"

[build]

[env]
  MTB_CACHE_DIR = "/data/.mtb_cache"
  INGEST_HOUR   = "12"
  CORS_ORIGINS  = "https://www.veloanalyzer.com,https://veloanalyzer.com"

[http_service]
  internal_port        = 8080
  force_https          = true
  # Always-on: the machine holds the warm .mtb_cache volume and the in-process
  # UCI history memo, both of which make on-demand analysis fast. See the plan's
  # "One always-on Machine" section.
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period  = "20s"
    interval      = "30s"
    method        = "GET"
    path          = "/health"
    timeout       = "5s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source      = "mtb_cache"
  destination = "/data"
