# ─── Cyclo-cross: JANEV Cup 2026/27 (Czech national cup) ──────────────────────
#
# `discipline: CX` switches the whole pipeline over to cyclo-cross: the UCI
# cyclo-cross ranking and calendar rather than MTB's, the cyclo-cross season
# label (a season runs Aug–Feb and the UCI files it under the later year), and
# its points rules. Entries with no `discipline:` stay MTB XCO.
#
# The grid here is set by the cup standings, not the UCI ranking — art. C0919:
# in year-long series riders line up "according to the current standings in
# those series". `cup_standings_url` is therefore a list tried in order: this
# season's page first, last season's behind it. Round one has no current
# standings to read and last season's final table is exactly what seeds its
# grid; from round two the current page takes over on its own.
#
# Junior women have no race of their own in the cup — they start with the women
# and U23 and are scored in the women's classification, which is also how the
# UCI ranks them (art. C1025). `birth_years:` pulls them back out of the
# combined start list; 2009 and 2010 are the 17- and 18-year-olds of the
# 2026/27 season. The national championship does run them separately, so its
# entry names that course instead and needs no filter.

