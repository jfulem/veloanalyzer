# Added 2026-08-06 — four Czech UCI XCO one-day races (competitions 77484-77487).
# Touškov and Vimperk are rounds of the same Czech Cup (ČP) series as Bedřichov,
# with live, verified sportsoft start lists (41 and 47 Men Elite riders resp.).
# Valbek Ústí and Tessuti are standalone C2 events, not part of that series.
# Neither organiser's start list is reachable after the fact — no working
# joycycling.cz path was found for Ústí (both /usti and /en/usti/ 404) and
# Tessuti's own start-list page is live but empty — so both rely entirely on
# riders_from_uci_competition() rebuilding the field from the official UCI
# classification. That path only fires on a *clean* empty/failed scrape, which
# is why the url below is deliberately something guaranteed to return 200 with
# no matching riders (the UCI competition page itself for Ústí) rather than
# left blank.
